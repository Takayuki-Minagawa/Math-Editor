<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数式エディタ - Math Equation Editor</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1 data-i18n="title">数式エディタ</h1>
    <button id="btn-lang" type="button" title="Switch language">EN</button>
  </header>

  <main>
    <section id="toolbar">
      <nav id="toolbar-tabs"></nav>
      <div id="toolbar-panels"></div>
    </section>

    <section id="workspace">
      <div id="editor-pane">
        <label for="latex-input" data-i18n="editorLabel">LaTeX入力</label>
        <textarea id="latex-input" data-i18n-placeholder="editorPlaceholder" placeholder="ここにLaTeXを入力、またはツールバーのボタンをクリック..." spellcheck="false"></textarea>
      </div>
      <div id="preview-pane">
        <label data-i18n="previewLabel">プレビュー</label>
        <div id="katex-output">
          <span class="placeholder" data-i18n="previewPlaceholder">ここにプレビューが表示されます</span>
        </div>
        <div id="error-output"></div>
      </div>
    </section>

    <section id="action-bar">
      <button id="btn-copy" type="button" data-i18n="btnCopy">LaTeXをコピー</button>
      <button id="btn-save" type="button" data-i18n="btnSave">Markdownで保存</button>
      <button id="btn-clear" type="button" data-i18n="btnClear">クリア</button>
    </section>

    <section id="guide">
      <button id="guide-toggle" type="button">
        <span data-i18n="guideTitle">使い方ガイド</span>
        <span id="guide-arrow">&#9660;</span>
      </button>
      <div id="guide-content">
        <div id="guide-body"></div>
      </div>
    </section>
  </main>

  <footer>
    <p>Math Equation Editor &mdash; Powered by <a href="https://katex.org/" target="_blank" rel="noopener noreferrer">KaTeX</a> (MIT License)</p>
    <p data-i18n="footerLicense">本アプリケーションは MIT License で公開されています。</p>
  </footer>

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"></script>
  <script defer src="js/toolbar-data.js"></script>
  <script defer src="js/i18n.js"></script>
  <script defer src="js/editor.js"></script>
  <script defer src="js/actions.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
